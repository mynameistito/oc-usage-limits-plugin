name: Release

on:
  push:
    branches:
      - main
      - opencode-v2
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.ref != 'refs/heads/opencode-v2'
    name: Version or Stage package@latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify npm supports staged OIDC publishing
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from "node:child_process";

          const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major = 0, minor = 0, patch = 0] = version.split(".").map(Number);
          const supportsStagedPublishing =
            major > 11 || (major === 11 && (minor > 15 || (minor === 15 && patch >= 0)));

          if (!supportsStagedPublishing) {
            throw new Error(`npm ${version} does not support staged OIDC publishing. Use npm >= 11.15.0.`);
          }
          EOF

      - name: Typecheck
        run: bun run typecheck

      - name: Check
        run: bun run check

      - name: Create release pull request or prepare publish
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          version-script: bunx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage package on npm
        id: package
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          package_name=$(node --print "require('./package.json').name")
          package_version=$(node --print "require('./package.json').version")
          package_spec="$package_name@$package_version"

          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$package_version" >> "$GITHUB_OUTPUT"

          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "$package_spec is already published"
            exit 0
          fi

          set +e
          stage_output=$(npm stage publish --access public --tag latest --provenance 2>&1)
          stage_status=$?
          set -e

          printf '%s\n' "$stage_output"

          if [ "$stage_status" -ne 0 ]; then
            case "$stage_output" in
              *"Cannot stage previously published version"*|*"already staged"*)
                echo "$package_spec is already published or staged"
                exit 0
                ;;
              *)
                exit "$stage_status"
                ;;
            esac
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.package.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          node --input-type=module <<'EOF' > release-notes.md
          import { readFile } from "node:fs/promises";

          const fallback = `Release ${process.env.PACKAGE_NAME}@${process.env.PACKAGE_VERSION}`;

          try {
            const changelog = await readFile("CHANGELOG.md", "utf8");
            const heading = `## ${process.env.PACKAGE_VERSION}`;
            const start = changelog.indexOf(heading);
            const bodyStart = start === -1 ? -1 : changelog.indexOf("\n", start) + 1;
            const nextHeading = bodyStart === -1 ? -1 : changelog.indexOf("\n## ", bodyStart);
            const notes = bodyStart === -1
              ? fallback
              : changelog.slice(bodyStart, nextHeading === -1 ? undefined : nextHeading).trim();

            console.log(notes || fallback);
          } catch {
            console.log(fallback);
          }
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists"
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$PACKAGE_NAME@$PACKAGE_VERSION" \
            --notes-file release-notes.md

  preview:
    if: github.ref == 'refs/heads/opencode-v2'
    name: Version or Stage package@next
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check
        run: bun run check

      - name: Create release pull request or prepare publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: bunx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage v2 preview package on npm
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          PACKAGE_NAME: oc-usage-limits-plugin
        run: |
          package_version=$(node --print "require('./package.json').version")
          package_spec="$PACKAGE_NAME@$package_version"

          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "$package_spec is already published"
            exit 0
          fi

          set +e
          stage_output=$(npm stage publish --access public --tag next --provenance 2>&1)
          stage_status=$?
          set -e

          printf '%s\n' "$stage_output"

          if [ "$stage_status" -ne 0 ]; then
            case "$stage_output" in
              *"Cannot stage previously published version"*|*"already staged"*)
                echo "$package_spec is already published or staged"
                exit 0
                ;;
              *)
                exit "$stage_status"
                ;;
            esac
          fi

      - name: Create v2 GitHub prerelease
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: oc-usage-limits-plugin
        run: |
          package_version=$(node --print "require('./package.json').version")
          release_tag="v$package_version"
          export PACKAGE_VERSION="$package_version"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "GitHub release $release_tag already exists"
            exit 0
          fi

          node --input-type=module <<'EOF' > release-notes.md
          import { readFile } from "node:fs/promises";

          const version = process.env.PACKAGE_VERSION;
          const fallback = `Release ${process.env.PACKAGE_NAME}@${version}`;

          try {
            const changelog = await readFile("CHANGELOG.md", "utf8");
            const heading = `## ${version}`;
            const start = changelog.indexOf(heading);
            const bodyStart = start === -1 ? -1 : changelog.indexOf("\n", start) + 1;
            const nextHeading = bodyStart === -1 ? -1 : changelog.indexOf("\n## ", bodyStart);
            const notes = bodyStart === -1
              ? fallback
              : changelog.slice(bodyStart, nextHeading === -1 ? undefined : nextHeading).trim();

            console.log(notes || fallback);
          } catch {
            console.log(fallback);
          }
          EOF

          gh release create "$release_tag" \
            --target "$GITHUB_SHA" \
            --title "$PACKAGE_NAME@$package_version" \
            --notes-file release-notes.md \
            --prerelease
